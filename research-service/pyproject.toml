[project]
name = "tradingai-research-service"
version = "0.1.0"
description = "TradingAI trade intelligence — legal-source news ingestion normalized to the Signal schema (roadmap Phase 6)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "tradingai-shared", "feedparser>=6.0", "requests>=2.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research_service*"]
