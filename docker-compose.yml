services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tradingai
      MINIO_ROOT_PASSWORD: tradingai_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379/0
      APP_SHARED_SECRET: ${APP_SHARED_SECRET:-}
    depends_on:
      - redis
      - minio
      - qdrant
      - mongodb
    ports:
      - "8000:8080"
    restart: unless-stopped
    mem_limit: 500m

  market-data-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.marketdata
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-7}
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 200m

  prelive:
    build:
      context: .
      dockerfile: docker/Dockerfile.prelive
    env_file:
      - .env
    depends_on:
      - mongodb
    restart: unless-stopped
    mem_limit: 200m

  # Option-SELLING paper desk. Same image as the buying desk (Dockerfile.prelive already
  # ships the whole prelive-service directory) but a different entrypoint, its own
  # prelive_selling_* collections and its own capital pool — the two desks share nothing
  # but the Dhan feed and the instruments table.
  #
  # NOT started by default: `docker-compose up -d` brings up the profiles it knows about,
  # and this one is held behind an explicit profile so a routine redeploy never silently
  # starts a desk that opens short option positions. Start it deliberately:
  #     docker-compose --profile selling up -d prelive-selling
  #
  # Gets more memory than the buying desk because it holds multi-leg structures across
  # sessions and re-marks every leg on every tick.
  prelive-selling:
    profiles: ["selling"]
    build:
      context: .
      dockerfile: docker/Dockerfile.prelive
    command: ["python", "main_selling.py"]
    env_file:
      - .env
    depends_on:
      - mongodb
    restart: unless-stopped
    mem_limit: 300m

  frontend:
    build:
      context: frontend
      dockerfile: ../docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped


  bars-feed:
    build:
      context: .
      dockerfile: docker/Dockerfile.marketdata
    command: ["sh", "-c", "python warmup_backfill.py; python live_feed.py"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 200m

volumes:
  redisdata:
  miniodata:
  qdrantdata:
  mongodata:
