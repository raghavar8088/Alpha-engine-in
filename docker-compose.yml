services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tradingai
      MINIO_ROOT_PASSWORD: tradingai_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379/0
      APP_SHARED_SECRET: ${APP_SHARED_SECRET:-}
    depends_on:
      - redis
      - minio
      - qdrant
      - mongodb
    ports:
      - "8000:8080"
    restart: unless-stopped
    mem_limit: 500m

  market-data-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.marketdata
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-7}
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 200m

  frontend:
    build:
      context: frontend
      dockerfile: ../docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redisdata:
  miniodata:
  qdrantdata:
  mongodata:
