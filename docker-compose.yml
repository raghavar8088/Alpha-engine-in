services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tradingai
      MINIO_ROOT_PASSWORD: tradingai_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  redisdata:
  miniodata:
  qdrantdata:
