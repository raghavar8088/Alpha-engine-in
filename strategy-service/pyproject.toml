[project]
name = "tradingai-strategy-service"
version = "0.1.0"
description = "TradingAI strategy library — Strategy implementations on the shared contract"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "tradingai-shared"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strategy_service*"]
