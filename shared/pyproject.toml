[project]
name = "tradingai-shared"
version = "0.1.0"
description = "Shared domain model and plugin contracts for TradingAI services"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradingai_shared*"]
