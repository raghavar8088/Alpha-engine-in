[project]
name = "tradingai-vector-service"
version = "0.1.0"
description = "TradingAI RAG store over Qdrant (roadmap Phase 6)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "tradingai-shared", "qdrant-client>=1.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vector_service*"]
