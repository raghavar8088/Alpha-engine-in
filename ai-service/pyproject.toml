[project]
name = "tradingai-ai-service"
version = "0.1.0"
description = "TradingAI AI research & trade intelligence (Anthropic Claude) — roadmap Phase 6"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "tradingai-shared", "anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_service*"]
