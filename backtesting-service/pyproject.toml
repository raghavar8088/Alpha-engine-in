[project]
name = "tradingai-backtesting-service"
version = "0.1.0"
description = "TradingAI backtesting engine — event-driven simulation with Indian cost model"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "tradingai-shared", "tradingai-strategy-service", "tradingai-risk-service"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backtesting_service*"]
