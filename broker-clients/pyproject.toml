[project]
name = "tradingai-broker-clients"
version = "0.1.0"
description = "Shared broker clients (Angel One market data) for TradingAI services"
requires-python = ">=3.11"
# httpx for the async client (backend), requests for the sync client (prelive daemons +
# market-data-service), pyotp for TOTP login. websocket-client is only needed by the
# optional streaming client and is imported lazily there, so it is not a hard dep here.
dependencies = ["httpx>=0.27", "requests>=2.31", "pyotp>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradingai_broker_clients*"]
